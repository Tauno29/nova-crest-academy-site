[build]
  command = "pnpm build:netlify"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Keep the existing same-origin /api/trpc, /api/oauth, /api/desktop, and
# /manus-storage paths working through the Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/manus-storage/*"
  to = "/.netlify/functions/api/manus-storage/:splat"
  status = 200
  force = true

# Wouter handles client-side routes in the browser; serve the Vite entrypoint
# for direct visits and refreshes on those routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
